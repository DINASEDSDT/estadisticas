
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>DINASED | Sistema Estadístico</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #183b5d, transparent 55%),
        linear-gradient(135deg, #06101d, #0d233a);
    }

    .contenedor {
      width: 100%;
      max-width: 440px;
      padding: 38px 30px;
      text-align: center;
      background: rgba(13, 35, 58, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .insignia {
      font-size: 42px;
      margin-bottom: 18px;
    }

    h1 {
      color: #d4af37;
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .descripcion {
      color: #d0e1f9;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-acceso {
      display: inline-block;
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(90deg, #d4af37, #f0d675);
      color: #08111e;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-acceso:hover {
      transform: translateY(-2px);
      background: #fff;
    }

    .aviso {
      margin-top: 22px;
      color: #ffdc73;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      margin-top: 30px;
      color: #a9bbcf;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: right;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <div class="insignia" aria-hidden="true">🛡️</div>

    <h1>DINASED SANTO DOMINGO</h1>

    <p class="descripcion">
      SISTEMA ESTADÍSTICO DE HOMICIDIOS INTENCIONALES
      <br><br>
      Acceso al portal institucional del sistema.
    </p>

    <a
      class="btn-acceso"
      href="https://script.google.com/macros/s/AKfycby6MrGNAxRTQ_NLbE4rQDD25pP9WsLW8XMVxgWMSM5I8BcYVd-KBZ26A5cr-8UQN_UwDw/exec"
      rel="noopener noreferrer">
      INGRESAR AL SISTEMA
    </a>

    <p class="aviso">
      Sistema de acceso restringido.
      Utilice únicamente si cuenta con autorización.
    </p>

    <footer>RESERVADO</footer>
  </main>
</body>
</html>
